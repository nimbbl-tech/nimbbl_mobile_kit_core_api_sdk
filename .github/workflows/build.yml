name: Build Nimbbl SDK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        required: true
        default: 'production'
        type: choice
        options:
        - development
        - pre-production
        - production

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        environment: [development, pre-production, production]
        include:
          - environment: development
            build_type: assembleDebug
            event_log_url: https://eventlogdev.nimbbl.tech/v1/log
            tenant_id: dev-tenant-id
          - environment: pre-production
            build_type: assembleRelease
            event_log_url: https://eventlogpp.nimbbl.tech/v1/log
            tenant_id: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e
          - environment: production
            build_type: assembleRelease
            event_log_url: https://eventlogpipepp.nimbbl.tech/v1/log
            tenant_id: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build SDK for ${{ matrix.environment }}
      env:
        EVENT_LOG_URL: ${{ matrix.event_log_url }}
        DEFAULT_TENANT_ID: ${{ matrix.tenant_id }}
      run: |
        echo "🏗️ Building for ${{ matrix.environment }} environment"
        echo "Event Log URL: $EVENT_LOG_URL"
        echo "Tenant ID: $DEFAULT_TENANT_ID"
        
        ./gradlew ${{ matrix.build_type }} \
          -PEVENT_LOG_URL="$EVENT_LOG_URL" \
          -PDEFAULT_TENANT_ID="$DEFAULT_TENANT_ID" \
          --no-daemon \
          --stacktrace
          
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sdk-${{ matrix.environment }}
        path: |
          build/outputs/
          build/libs/
        retention-days: 30
        
    - name: Run tests
      run: |
        ./gradlew test
        
    - name: Build report
      if: always()
      run: |
        echo "📊 Build Summary for ${{ matrix.environment }}"
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Event Log URL: ${{ matrix.event_log_url }}"
        echo "Tenant ID: ${{ matrix.tenant_id }}"
        echo "Status: ${{ job.status }}" 