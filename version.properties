# Release Notes
# v4.0.12 - 2025-03-06
# - Keep ApiResult in ProGuard so AAR consumers (e.g. WebView SDK) can resolve .code, .rawBody, .isSuccessful

# v4.0.11 - 2025-11-01
# - All repository HTTP calls run on Dispatchers.IO (no main-thread blocking)
# - EventLoggingService uses shared getIPAddress extension, removed dead catch
# - Added kotlinx-coroutines-android dependency
# - ProGuard rules aligned with HttpURLConnection + org.json (no Gson/Retrofit/OkHttp)
# - Init and lazy repo creation run IP fetch on Dispatchers.IO

# v4.0.6 - 2025-01-29
# - Fixed ProGuard integration for production builds
# - Added comprehensive consumer ProGuard rules
# - Fixed JWT token parsing with minification enabled
# - Enhanced JSON serialization protection (org.json)
# - Added automatic ProGuard rule application via consumer-rules.pro
# - Production-ready with isMinifyEnabled = true support

# v4.0.0 - 2024-01-15
# - Enhanced error handling with comprehensive validation
# - Improved code quality and reduced warnings
# - Added semantic versioning support
# - Fixed parameter order consistency in ValidationUtils
# - Removed redundant variable initializers
# - Optimized null safety handling
# - Implemented centralized version management system
