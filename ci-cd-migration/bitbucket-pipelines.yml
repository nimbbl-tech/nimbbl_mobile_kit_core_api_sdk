image: openjdk:17

definitions:
  caches:
    gradle: ~/.gradle/caches
  steps:
    - step: &build-step
        name: Build and Test
        caches:
          - gradle
        script:
          - chmod +x gradlew
          - ./gradlew $GRADLE_BUILD_TYPE \
              -PEVENT_LOG_URL="$EVENT_LOG_URL" \
              -PDEFAULT_TENANT_ID="$DEFAULT_TENANT_ID" \
              --no-daemon \
              --stacktrace
          - ./gradlew test
        artifacts:
          - build/outputs/**
          - build/libs/**
          - build/reports/**

pipelines:
  default:
    - step: *build-step
      name: Build for Production
      variables:
        GRADLE_BUILD_TYPE: assembleRelease
        EVENT_LOG_URL: https://eventlogpipepp.nimbbl.tech/v1/log
        DEFAULT_TENANT_ID: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e

  branches:
    develop:
      - step: *build-step
        name: Build for Development
        variables:
          GRADLE_BUILD_TYPE: assembleDebug
          EVENT_LOG_URL: https://eventlogdev.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: dev-tenant-id
      - step: *build-step
        name: Build for Pre-Production
        variables:
          GRADLE_BUILD_TYPE: assembleRelease
          EVENT_LOG_URL: https://eventlogpp.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e

  pull-requests:
    '**':
      - step: *build-step
        name: Build for Development (PR)
        variables:
          GRADLE_BUILD_TYPE: assembleDebug
          EVENT_LOG_URL: https://eventlogdev.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: dev-tenant-id

  custom:
    build-development:
      - step: *build-step
        name: Build for Development
        variables:
          GRADLE_BUILD_TYPE: assembleDebug
          EVENT_LOG_URL: https://eventlogdev.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: dev-tenant-id

    build-pre-production:
      - step: *build-step
        name: Build for Pre-Production
        variables:
          GRADLE_BUILD_TYPE: assembleRelease
          EVENT_LOG_URL: https://eventlogpp.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e

    build-production:
      - step: *build-step
        name: Build for Production
        variables:
          GRADLE_BUILD_TYPE: assembleRelease
          EVENT_LOG_URL: https://eventlogpipepp.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e

    build-all-environments:
      - step: *build-step
        name: Build for Development
        variables:
          GRADLE_BUILD_TYPE: assembleDebug
          EVENT_LOG_URL: https://eventlogdev.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: dev-tenant-id
      - step: *build-step
        name: Build for Pre-Production
        variables:
          GRADLE_BUILD_TYPE: assembleRelease
          EVENT_LOG_URL: https://eventlogpp.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e
      - step: *build-step
        name: Build for Production
        variables:
          GRADLE_BUILD_TYPE: assembleRelease
          EVENT_LOG_URL: https://eventlogpipepp.nimbbl.tech/v1/log
          DEFAULT_TENANT_ID: 5fd6a596-a39f-4cb2-9a4b-ed72713e537e 